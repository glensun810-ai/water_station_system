# Nginx生产环境配置 - 进化湾服务系统
# 子域名规划: jhw-ai.com / www.jhw-ai.com / app.jhw-ai.com / admin.jhw-ai.com / api.jhw-ai.com
# 服务器: 120.76.156.83

# ============================================================
# HTTP → HTTPS 重定向（所有域名）
# ============================================================
server {
    listen 80;
    server_name jhw-ai.com www.jhw-ai.com app.jhw-ai.com admin.jhw-ai.com api.jhw-ai.com;
    return 301 https://$host$request_uri;
}

# ============================================================
# 官网主页: jhw-ai.com / www.jhw-ai.com
# ============================================================
server {
    listen 443 ssl http2;
    server_name jhw-ai.com www.jhw-ai.com;

    ssl_certificate /var/www/jhw-ai.com/ssl/jhw-ai.com.pem;
    ssl_certificate_key /var/www/jhw-ai.com/ssl/jhw-ai.com.key;
    include /etc/nginx/conf.d/ssl-security.conf;

    root /var/www/jhw-ai.com/website;
    index index.html;

    access_log /var/log/nginx/jhw-ai.com_access.log;
    error_log /var/log/nginx/jhw-ai.com_error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# 用户服务门户: app.jhw-ai.com
# 包含: 用水服务、会议室预约、空间预约、个人中心
# ============================================================
server {
    listen 443 ssl http2;
    server_name app.jhw-ai.com;

    ssl_certificate /var/www/jhw-ai.com/ssl/jhw-ai.com.pem;
    ssl_certificate_key /var/www/jhw-ai.com/ssl/jhw-ai.com.key;
    include /etc/nginx/conf.d/ssl-security.conf;

    access_log /var/log/nginx/app_access.log;
    error_log /var/log/nginx/app_error.log;

    # Portal 首页 → 用户服务门户
    location / {
        alias /var/www/jhw-ai.com/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # 空间服务前端
    location /space-frontend/ {
        alias /var/www/jhw-ai.com/space-frontend/;
        index index.html;
        try_files $uri $uri/ /space-frontend/index.html;
    }

    # 水站前端
    location /water/ {
        alias /var/www/jhw-ai.com/apps/water/frontend/;
        index index.html;
        try_files $uri $uri/ /water/index.html;
    }

    # 会议室前端
    location /meeting-frontend/ {
        alias /var/www/jhw-ai.com/apps/meeting/frontend/;
        index index.html;
        try_files $uri $uri/ /meeting-frontend/index.html;
    }

    # 共享静态资源
    location /shared/ {
        alias /var/www/jhw-ai.com/shared/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# 管理后台: admin.jhw-ai.com
# 包含: 水站管理、会议室管理、空间管理、用户管理、结算管理
# 安全: 建议配置 IP 白名单或 VPN 访问
# ============================================================
server {
    listen 443 ssl http2;
    server_name admin.jhw-ai.com;

    ssl_certificate /var/www/jhw-ai.com/ssl/jhw-ai.com.pem;
    ssl_certificate_key /var/www/jhw-ai.com/ssl/jhw-ai.com.key;
    include /etc/nginx/conf.d/ssl-security.conf;

    access_log /var/log/nginx/admin_access.log;
    error_log /var/log/nginx/admin_error.log;

    # 管理后台首页
    location / {
        alias /var/www/jhw-ai.com/portal/admin/;
        index index.html login.html;
        try_files $uri $uri/ /portal/admin/login.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理后台共享资源
    location /portal/ {
        alias /var/www/jhw-ai.com/portal/;
    }

    location /shared/ {
        alias /var/www/jhw-ai.com/shared/;
    }
}

# ============================================================
# API 服务: api.jhw-ai.com
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.jhw-ai.com;

    ssl_certificate /var/www/jhw-ai.com/ssl/jhw-ai.com.pem;
    ssl_certificate_key /var/www/jhw-ai.com/ssl/jhw-ai.com.key;
    include /etc/nginx/conf.d/ssl-security.conf;

    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;

    # 速率限制（保护登录等敏感接口）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req zone=api_limit burst=10 nodelay;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8008/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API 文档（Swagger）
    location /docs {
        proxy_pass http://127.0.0.1:8008/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8008/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8008/openapi.json;
        proxy_set_header Host $host;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ============================================================
# IP 地址直接访问（HTTP，用于测试）
# ============================================================
server {
    listen 80;
    server_name 120.76.156.83;

    access_log /var/log/nginx/ip_access.log;
    error_log /var/log/nginx/ip_error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    root /var/www/jhw-ai.com/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /portal/index.html;
    }

    location /portal/ { alias /var/www/jhw-ai.com/portal/; }
    location /space-frontend/ { alias /var/www/jhw-ai.com/space-frontend/; }
    location /shared/ { alias /var/www/jhw-ai.com/shared/; }

    location /api/ {
        proxy_pass http://127.0.0.1:8008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8008/docs;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_set_header Host $host;
        access_log off;
    }
}

