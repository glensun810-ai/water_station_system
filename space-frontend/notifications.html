<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>通知 - AI产业集群</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/shared/static/vendor/vue/vue.global.js"></script>
    <link rel="stylesheet" href="/portal/assets/css/design-system.css">
    <script src="/portal/assets/js/auth.js"></script>
    <link rel="stylesheet" href="/portal/components/GlobalHeader.css">
    <script src="/portal/components/GlobalHeader.js"></script>
    <script type="module" src="./api.js"></script>
    <script src="./toast.js"></script>

    <style>
        [v-cloak] { display: none !important; }
        
        body {
            background: var(--bg-secondary);
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
        }
        
        .filter-tabs {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            background: white;
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
        }
        
        .filter-tab {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
        }
        
        .filter-tab:hover {
            background: var(--bg-secondary);
        }
        
        .filter-tab.active {
            background: var(--primary);
            color: white;
        }
        
        .notification-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            gap: var(--spacing-lg);
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        
        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .notification-card.unread {
            border-left: 4px solid var(--primary);
        }
        
        .notification-card.read {
            opacity: 0.7;
        }
        
        .notification-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-sm);
        }
        
        .notification-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .notification-time {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .notification-text {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-md);
        }
        
        .notification-action {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .action-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-lg);
        }
        
        .unread-badge {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .notification-card {
                flex-direction: row;
                gap: var(--spacing-sm);
                padding: var(--spacing-md);
            }

            .notification-icon {
                width: 32px;
                height: 32px;
                font-size: 24px;
                flex-shrink: 0;
            }
        }

        .bottom-nav {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: var(--spacing-sm) var(--spacing-lg);
            position: sticky;
            bottom: 0;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xs, 4px);
            padding: var(--spacing-md, 8px);
            min-height: 44px;
            min-width: 44px;
            color: var(--text-secondary);
            transition: color 0.2s;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item:hover,
        .nav-item.active {
            color: var(--primary);
        }
        .nav-item:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-icon svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .nav-label {
            font-size: var(--font-size-xs, 12px);
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <global-header role="banner" back-url="/space-frontend/index.html" back-text="返回空间服务" :breadcrumbs='[{"text":"通知中心","url":"/space-frontend/notifications.html"}]'></global-header>

        <!-- Main Content -->
        <main class="main-container">
            <!-- 全部已读按钮 -->
            <div style="text-align: right; margin-bottom: var(--spacing-md);">
                <button class="action-btn btn-secondary" @click="markAllRead">
                    全部标记已读
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <div 
                    class="filter-tab"
                    :class="{ active: activeFilter === 'all' }"
                    @click="setFilter('all')"
                >
                    全部
                </div>
                <div 
                    class="filter-tab"
                    :class="{ active: activeFilter === 'unread' }"
                    @click="setFilter('unread')"
                >
                    未读
                    <span v-if="unreadCount > 0" class="unread-badge">{{ unreadCount }}</span>
                </div>
                <div 
                    class="filter-tab"
                    :class="{ active: activeFilter === 'booking' }"
                    @click="setFilter('booking')"
                >
                    预约通知
                </div>
                <div 
                    class="filter-tab"
                    :class="{ active: activeFilter === 'approval' }"
                    @click="setFilter('approval')"
                >
                    审批通知
                </div>
                <div 
                    class="filter-tab"
                    :class="{ active: activeFilter === 'reminder' }"
                    @click="setFilter('reminder')"
                >
                    提醒通知
                </div>
            </div>
            
            <!-- Notification List -->
            <div v-if="filteredNotifications.length > 0">
                <div 
                    v-for="notification in filteredNotifications" 
                    :key="notification.id"
                    class="notification-card"
                    :class="{ unread: !notification.read, read: notification.read }"
                    @click="handleNotificationClick(notification)"
                >
                    <div class="notification-icon">
                        {{ notification.icon }}
                    </div>
                    
                    <div class="notification-content">
                        <div class="notification-header">
                            <div class="notification-title">{{ notification.title }}</div>
                            <div class="notification-time">{{ notification.time }}</div>
                        </div>
                        
                        <div class="notification-text">{{ notification.text }}</div>
                        
                        <div class="notification-action">
                            <button
                                v-if="notification.bookingNo"
                                class="action-btn btn-primary"
                                @click.stop="viewBooking()"
                            >
                                查看预约
                            </button>
                            <button
                                v-if="!notification.read"
                                class="action-btn btn-secondary"
                                @click.stop="markAsRead(notification.id)"
                            >
                                标记已读
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Empty State -->
            <div v-else class="empty-state">
                <div class="empty-icon">🔔</div>
                <div style="font-size: var(--font-size-lg); margin-bottom: var(--spacing-md);">
                    暂无通知
                </div>
                <div style="color: var(--text-secondary);">
                    您的通知中心当前为空
                </div>
            </div>
        </main>

        <nav class="bottom-nav" role="navigation" aria-label="底部导航">
            <a href="/space-frontend/index.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                <span class="nav-label">首页</span>
            </a>
            <a href="/space-frontend/calendar.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                <span class="nav-label">日历</span>
            </a>
            <a href="/space-frontend/my-bookings.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
                <span class="nav-label">预约</span>
            </a>
            <a href="/space-frontend/notifications.html" class="nav-item active" aria-current="page">
                <span class="nav-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
                <span class="nav-label">通知</span>
            </a>
            <a href="/space-frontend/profile.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                <span class="nav-label">我的</span>
            </a>
        </nav>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        
        createApp({
            components: { 'global-header': GlobalHeader },
            setup() {
                const currentUser = ref(null);
                const activeFilter = ref('all');
                const notifications = ref([]);
                
                const unreadCount = computed(() => {
                    return notifications.value.filter(n => !n.read).length;
                });
                
                const filteredNotifications = computed(() => {
                    if (activeFilter.value === 'all') {
                        return notifications.value;
                    } else if (activeFilter.value === 'unread') {
                        return notifications.value.filter(n => !n.read);
                    } else {
                        return notifications.value.filter(n => n.type === activeFilter.value);
                    }
                });
                
                const loadNotifications = async () => {
                    try {
                        const user = await checkAuth({ requireAuth: true, validateToken: true });
                        
                        if (user) {
                            currentUser.value = user;
                            console.log('用户已登录:', currentUser.value);
                            
                            // 加载通知列表（模拟数据）
                            await loadNotificationData();
                        } else {
                            window.location.href = '/portal/admin/login.html';
                        }
                    } catch (error) {
                        console.error('加载通知失败:', error);
                    }
                };
                
                const loadNotificationData = async () => {
                    try {
                        const data = await window.spaceAPI.getNotifications({ limit: 50 });

                        if (data.code === 200 && data.data.items) {
                            notifications.value = data.data.items.map(n => {
                                let icon = '📋';
                                let actionType = null;
                                let bookingId = null;

                                // 根据通知类型和标题设置图标和行为
                                if (n.type === 'warning') {
                                    icon = '❌';
                                } else if (n.title.includes('取消')) {
                                    icon = '📋';
                                } else if (n.title.includes('成功') || n.title.includes('通过')) {
                                    icon = '✅';
                                } else if (n.title.includes('拒绝')) {
                                    icon = '❌';
                                }

                                // 尝试从content中提取booking_no
                                const bookingNoMatch = n.content?.match(/预约编号[：:]\s*(\w+)/);
                                const bookingNo = bookingNoMatch ? bookingNoMatch[1] : '';

                                return {
                                    id: n.id,
                                    type: n.type || 'info',
                                    icon,
                                    title: n.title,
                                    text: n.content || '',
                                    time: n.created_at ? new Date(n.created_at).toLocaleDateString() : '',
                                    read: n.is_read === 1,
                                    actionType,
                                    bookingId,
                                    bookingNo,
                                };
                            });
                        }
                    } catch (error) {
                        console.error('加载通知失败:', error);
                        notifications.value = [];
                    }
                };
                
                const setFilter = (filter) => {
                    activeFilter.value = filter;
                };
                
                const handleNotificationClick = (notification) => {
                    if (!notification.read) {
                        markAsRead(notification.id);
                    }
                };
                
                const markAsRead = async (notificationId) => {
                    try {
                        await window.spaceAPI.markNotificationRead(notificationId);

                        const notification = notifications.value.find(n => n.id === notificationId);
                        if (notification) {
                            notification.read = true;
                        }
                    } catch (error) {
                        console.error('标记已读失败:', error);
                    }
                };

                const markAllRead = async () => {
                    try {
                        await window.spaceAPI.markAllNotificationsRead();

                        notifications.value.forEach(n => {
                            n.read = true;
                        });
                    } catch (error) {
                        console.error('批量标记已读失败:', error);
                    }
                };
                
                const viewBooking = () => {
                    window.location.href = '/space-frontend/my-bookings.html';
                };

                const goBack = () => {
                    window.location.href = '/portal/index.html';
                };
                
                onMounted(() => {
                    loadNotifications();
                });
                
                return {
                    currentUser,
                    activeFilter,
                    notifications,
                    unreadCount,
                    filteredNotifications,
                    setFilter,
                    handleNotificationClick,
                    markAsRead,
                    markAllRead,
                    viewBooking,
                    goBack
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
