<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - 服务器错误</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/shared/static/vendor/vue/vue.global.js"></script>
    <link rel="stylesheet" href="/portal/components/GlobalHeader.css">
    <script src="/portal/components/GlobalHeader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .error-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 48px 32px;
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #D97706;
            line-height: 1;
            margin-bottom: 16px;
            opacity: 0.8;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 16px;
            color: #64748B;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #D97706;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            margin: 0 8px;
        }
        .home-btn:hover {
            background: #B45309;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }
        .retry-btn {
            display: inline-block;
            padding: 12px 32px;
            background: white;
            color: #D97706;
            border: 2px solid #D97706;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            margin: 0 8px;
            cursor: pointer;
        }
        .retry-btn:hover {
            background: #FFFBEB;
        }
    </style>
</head>
<body>
    <div id="header-app"><global-header role="banner"></global-header></div>
    <div class="error-wrapper">
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="error-title">服务器内部错误</h1>
        <p class="error-desc">服务器遇到意外错误，无法完成您的请求。<br>请稍后重试，或联系技术支持。</p>
        <a href="/portal/index.html" class="home-btn">返回首页</a>
        <a href="javascript:location.reload()" class="retry-btn">重新加载</a>
    </div>
    </div>
    <script>
        const { createApp } = Vue;
        createApp({ components: { 'global-header': GlobalHeader } }).mount('#header-app');
    </script>
</body>
</html>
