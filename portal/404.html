<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/shared/static/vendor/vue/vue.global.js"></script>
    <link rel="stylesheet" href="/portal/components/GlobalHeader.css">
    <script src="/portal/components/GlobalHeader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .error-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 48px 32px;
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #2563EB;
            line-height: 1;
            margin-bottom: 16px;
            opacity: 0.8;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 16px;
            color: #64748B;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #2563EB;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .home-btn:hover {
            background: #1D4ED8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div id="header-app"><global-header role="banner"></global-header></div>
    <div class="error-wrapper">
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">页面未找到</h1>
        <p class="error-desc">您访问的页面不存在或已被移除。<br>请检查网址是否正确，或返回首页。</p>
        <a href="/portal/index.html" class="home-btn">返回首页</a>
    </div>
    </div>
    <script>
        const { createApp } = Vue;
        createApp({ components: { 'global-header': GlobalHeader } }).mount('#header-app');
    </script>
</body>
</html>
